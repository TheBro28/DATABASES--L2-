{% extends "layout.html" %}

{% block content %}
<div class="sandwich-hero">

    <!-- Sandwich image -->
    <div class="sandwich-hero-image-container">
        <img src="{{ sandwich[3] }}" alt="{{ sandwich[1] }}">
    </div>

    <div class="sandwich-hero-content">
        <!--Back to menu button with left arrow-->
        <p class="sandwich-hero-back"><a href="{{ url_for('menu') }}">&larr; Back to Menu</a></p>

        <!-- Index 1: Name -->
        <h1 class="sandwich-hero-name">{{ sandwich[1] }}</h1>

        <!-- Index 4: Price formatted -->
        <p class="sandwich-hero-price">${{ "%.2f"|format(sandwich[4]) }}</p>

        <!-- Index 2: Description -->
        <p class="sandwich-hero-description">{{ sandwich[2] }}</p>

        <!-- Triggers the premade session cart route, passing the sandwich ID directly -->
        <a href="{{ url_for('add_premade_to_session', item_id=sandwich[0]) }}" class="sandwich-hero-btn">
            Add To Cart
            <span class="sandwich-hero-btn-icon">
                <span class="material-icons">arrow_forward</span>
            </span>
        </a>
    </div>

</div>
{% endblock %}
