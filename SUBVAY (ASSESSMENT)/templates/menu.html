{% extends "layout.html" %} Menu {% block title %} {% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    <link rel="sylesheet"href="https://www.w3schools.com/w3css/4/w3.css">
    <title>Menu</title>
</head>
<body>
    <h1>MENU PAGE</h1>


<h2>Our Sandwich Menu</h2>

{% if all_sandwiches %}
    <div class="sandwich-list">
    {% for sandwich in all_sandwiches %}
        <div class="sandwich-card">
            <!-- Index 1: image_url -->
            <img src="{{ sandwich[1] }}" alt="{{ sandwich[0] }}" width="150">
            <!-- Index 0: name -->
            <h4>{{ sandwich[0] }}</h4>
            <!-- Index 2: price -->
            <p>Price: ${{ "%.2f"|format(sandwich[2]) }}</p>
        </div>
    {% endfor %}
    </div>
{% else %}
    <p>The menu is currently empty.</p>
{% endif %}

</body>
</html>
