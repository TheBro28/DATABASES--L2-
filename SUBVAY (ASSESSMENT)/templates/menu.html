{% extends "layout.html" %}

{% block content %}
    <h1>MENU PAGE</h1>

<h2>Our Sandwich Menu</h2>

{% if all_sandwiches %}
    <div class="sandwich-list three-column">
    {% for sandwich in all_sandwiches %}
    
    <!-- Index 0: ID --->
    <a href="{{ url_for('sandwich', id=sandwich[0]) }}">
        <div class="sandwich-card">
            <!-- Index 3: image_url -->
            <img src="{{ sandwich[3] }}" alt="{{ sandwich[1] }}" width="250">
            
            <!-- Index 1: name -->
            <h2>{{ sandwich[1] }}</h2>
            
            <!-- Index 4: price -->
            <p class="price-text">Price: ${{ "%.2f"|format(sandwich[4]) }}</p>
        </div>
    </a>
    
    {% endfor %}
    </div>
{% else %}
    <p>The menu is currently empty.</p>
{% endif %}

{% endblock %}
